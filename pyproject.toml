[project]
name = "project-epistemic-bound"
version = "0.1.0.dev0"
description = "Local workroom and evaluation workbench for an operational AI agent whose assignments, commitments, proposed actions, permissions, corrections and observed effects can be inspected. v0.1 is synthetic-workspace only."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7,<3",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "textual>=8.2.8",
  "jsonschema>=4.23,<5",
  "anthropic>=0.67,<1",
]

[project.scripts]
peb = "peb.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/peb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Work that is created and never awaited is work silently dropped, not a style warning: the cockpit hands
# coroutines to Textual workers, and an exclusive worker cancelled before it starts must not leave one behind.
# Exactly that class fails the suite; every other warning stays a warning.
# The first entry alone does NOT catch the dropped-worker case: an un-awaited coroutine is collected by the
# garbage collector, so the warning arrives through the unraisable hook wrapped as
# PytestUnraisableExceptionWarning and never passes through this filter. Shown empirically on 2026-09-13
# by restoring the pre-d3f5458 dispatch: 45/45 TUI tests still passed. The second entry is the real guard.
filterwarnings = ["error:coroutine .* was never awaited:RuntimeWarning",
                  "error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.isort]
# Every lane is ruff-clean alone but re-sorts after a merge unless `peb` is pinned first-party:
# ruff classifies a sibling lane's not-yet-present module as third-party (trial v3, 2026-09-11).
known-first-party = ["peb"]
